name: Refresh OPTC campaign feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch the official campaign posts
        run: node scripts/refresh-optc-news.mjs

      - name: Commit changed source data
        run: |
          if [ -z "$(git status --short -- data/official-campaign-feed.json)" ]; then
            echo "No official campaign changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official-campaign-feed.json
          git commit -m "Refresh official OPTC campaign feed"
          git push
