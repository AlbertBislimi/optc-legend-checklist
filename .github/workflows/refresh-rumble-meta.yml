name: Refresh OPTC Rumble unit data

on:
  workflow_dispatch:
  schedule:
    - cron: '42 */6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh referenced Rumble stats and tags
        run: node scripts/refresh-rumble-meta.mjs

      - name: Commit changed Rumble data
        run: |
          if [ -z "$(git status --short -- data/rumble-meta-units.json)" ]; then
            echo "No Rumble unit changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rumble-meta-units.json
          git commit -m "Refresh OPTC Rumble unit data"
          git push
